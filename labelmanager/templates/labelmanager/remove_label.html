<h2>Remove Label</h2>

<p><strong>{{ label.label }}</strong></p>
<img src="{{ label.image_path }}" width="150">

<form method="POST">
    {% csrf_token %}
    <label>Reason for removal:</label><br>
    <textarea name="reason" rows="4" cols="40" required></textarea><br><br>
    <button type="submit">Confirm Remove</button>
</form>

<a href="{% url 'label_list' %}">Back</a>
